[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "{{ cookiecutter.python_package }}"
description = "My augeias setup"
version = "0.0.1"

dependencies = [
    "augeias",
    "pyramid",
]

[project.optional-dependencies]
dev = [
    "flake8==7.0.0",
    "hatchling==1.24.2",
    "pyramid-debugtoolbar==4.12.1",
    "pytest-cov==5.0.0",
    "pytest==8.2.2",
    "sphinx==7.3.7",
    "sphinx_rtd_theme==2.0.0",
    "sphinxcontrib-httpdomain==1.8.1",
    "tempdir==0.7.1",
    "uv==0.1.38",
    "waitress==3.0.0",
    "webtest==3.0.0"
]

[project.entry-points."paste.app_factory"]
main = "{{ cookiecutter.python_package }}:main"
